server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # asset filenames carry a content hash, so they can be cached hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # the page itself must not be, or a rebuild never reaches the browser
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # the Claude Code connector, if it is running. same origin, so the board just calls
  # /bridge and there is no cross origin or mixed content to think about
  location /bridge/ {
    proxy_pass http://host.docker.internal:4319/;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
