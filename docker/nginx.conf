server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # asset filenames carry a content hash, so they can be cached hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # the page itself must not be, or a rebuild never reaches the browser
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # the sync api, on the same origin as the board. same origin means no cors to get wrong
  # and no second hostname to set up dns for - and IndexedDB is per origin anyway, so the
  # board and its server sharing one address is the arrangement that already has to hold
  location /api/ {
    proxy_pass http://taskboard-sync:4320;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    # a board full of notes is bigger than the default 1m
    client_max_body_size 8m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
