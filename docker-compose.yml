services:
  taskboard:
    build: .
    container_name: taskboard
    # change the left hand number if 8080 is already taken on your unraid box
    ports:
      - "8080:80"
    restart: unless-stopped
    # so the /bridge proxy can reach the Claude Code connector running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
